services:
  camofox:
    image: ${CAMOFOX_IMAGE:-sxkiss/camofox-browser:latest}
    container_name: camofox-browser
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - camofox-data:/app/data
    shm_size: "1g"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9377/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  camofox-data:
